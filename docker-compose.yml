services:
  postgres:
    image: postgres:18.6-alpine
    container_name: scorehub-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: scorehub
      POSTGRES_PASSWORD: scorehub
      POSTGRES_DB: scorehub
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - scorehub-postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scorehub -d scorehub"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  scorehub-postgres-data: